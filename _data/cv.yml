      summary: 'Project: The reorganization of memory representations during rest and sleep'
      highlights:
      - Study memory reorganization during rest and sleep using human neuroimaging methods (MEG/EEG), machine learning, and
        animal models (One-photon calcium imaging in mice).
    - company: Department of Psychology, University of Jyväskylä
      position: Postdoctoral Researcher
      location: Finland
      start_date: 2020-09
      end_date: 2022-08
      summary: 'Project: Bodily rhythms and learning'
      highlights:
      - 'Investigated the interaction between physiological rhythms (such as heartbeat and breathing) and learning processes
        using behavioral and brain measures (M/EEG) in the Academy of Finland project "Optimizing Learning: Synchrony of the
        Brain and Body as a Tool?" (Dr. Miriam Nokia''s group).'
      - Set up new calcium imaging systems and developed a data analysis pipeline for the Academy of Finland project "Dentate
        gyrus - the gateway to memory?" (Dr. Markku Penttonen).
    - company: Department of Psychology, University of Jyväskylä
      position: Doctoral Student
